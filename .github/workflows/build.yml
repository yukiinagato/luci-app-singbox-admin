name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.1")
          BASE_VER=$(echo "$LATEST_TAG" | sed 's/^v//')
          TIMESTAMP=$(date +%Y%m%d%H%M)
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
            FINAL_VER="${RAW_VER}-1"
            # apk revision format: 1.2.3-r1
            APK_VER="${RAW_VER}-r1"
          else
            # Dev build. The .ipk name keeps the short SHA; apk's version
            # grammar forbids it (no arbitrary '-' segments / hex), so the .apk
            # uses the '_git<timestamp>' suffix apk understands, revision r0.
            FINAL_VER="${BASE_VER}-git-${TIMESTAMP}-${SHORT_SHA}"
            APK_VER="${BASE_VER}_git${TIMESTAMP}-r0"
          fi

          echo "FINAL_VER=$FINAL_VER" >> $GITHUB_ENV
          echo "APK_VER=$APK_VER" >> $GITHUB_ENV
          sed -i "s/Version: .*/Version: $FINAL_VER/" control

      - name: Build IPK (legacy opkg)
        run: |
          mkdir -p ipk_root/CONTROL
          [ -f "control" ] && cp control ipk_root/CONTROL/
          # Maintainer scripts (postinst/prerm/postrm) must live in CONTROL/.
          for s in preinst postinst prerm postrm; do
            [ -f "$s" ] && cp "$s" ipk_root/CONTROL/
          done
          [ -d "root" ] && cp -r root/* ipk_root/
          # LuCI convention: htdocs/ maps to /www on the device.
          if [ -d "htdocs" ]; then
            mkdir -p ipk_root/www
            cp -r htdocs/* ipk_root/www/
          fi
          # Mark UCI config as a conffile so opkg upgrades don't clobber the
          # user's settings (fw_boot/backup_keep/panel_path/wrap). opkg only
          # preserves files listed here; without it every upgrade overwrites
          # /etc/config/singbox. (apk protects it automatically by content
          # hash, so no equivalent is needed on the apk side.)
          if [ -f "ipk_root/etc/config/singbox" ]; then
            echo "/etc/config/singbox" >> ipk_root/CONTROL/conffiles
          fi
          # Strip any stray editor/OS junk so it never ships in a package.
          find ipk_root \( -name '.DS_Store' -o -name '._*' \) -delete
          chmod -R 755 ipk_root/
          wget -q https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build
          chmod +x ipkg-build
          ./ipkg-build ipk_root .

      - name: Build Host apk-tools (mainline package format)
        run: |
          sudo apt-get update -qq
          # lua5.1 is needed by apk-tools' -Dhelp=enabled (help text generator).
          sudo apt-get install -y -qq meson ninja-build libssl-dev zlib1g-dev lua5.1
          # Clone from Alpine's GitHub mirror first (GitHub-to-GitHub is
          # reliable inside Actions); gitlab.alpinelinux.org has timed out from
          # the runners. The mirror carries the identical v3.0.5 tag.
          git clone --depth 1 --branch v3.0.5 https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools \
            || git clone --depth 1 --branch v3.0.5 https://gitlab.alpinelinux.org/alpine/apk-tools.git /tmp/apk-tools
          cd /tmp/apk-tools
          # Same options as OpenWrt mainline's package/system/apk host build.
          meson setup build --prefix=/usr --buildtype=release \
            -Db_lto=true -Ddocs=disabled -Dhelp=enabled -Dlua_version=5.1 \
            -Ddefault_library=static -Durl_backend=wget -Dzstd=disabled \
            -Dpython=disabled -Dtests=disabled -Dcrypto_backend=openssl
          ninja -C build

      - name: Build APK (apk-tools / OpenWrt mainline)
        run: |
          mkdir -p apk_root apk_scripts artifacts
          [ -d "root" ] && cp -r root/* apk_root/
          # LuCI convention: htdocs/ maps to /www on the device.
          if [ -d "htdocs" ]; then
            mkdir -p apk_root/www
            cp -r htdocs/* apk_root/www/
          fi
          find apk_root \( -name '.DS_Store' -o -name '._*' \) -delete
          # opkg-style postinst -> apk post-install script slot.
          if [ -f "postinst" ]; then
            cp postinst apk_scripts/post-install
            chmod 755 apk_scripts/post-install
          fi
          chmod -R 755 apk_root/
          APK_DESC=$(awk 'f{print} /^Description:/{f=1}' control | tr '\n' ' ')
          /tmp/apk-tools/build/src/apk mkpkg \
            --info "name:luci-app-singbox-admin" \
            --info "version:${{ env.APK_VER }}" \
            --info "description:$APK_DESC" \
            --info "arch:noarch" \
            --info "license:MIT" \
            --info "origin:luci-app-singbox-admin" \
            --info "url:https://github.com/yukiinagato/luci-app-singbox-admin" \
            --info "maintainer:Yukiinagato" \
            --info "depends:luci-base sing-box nftables" \
            --script "post-install:$PWD/apk_scripts/post-install" \
            --files "$PWD/apk_root" \
            --output "$PWD/artifacts/luci-app-singbox-admin_${{ env.APK_VER }}_all.apk"

      - name: Collect Artifacts
        run: |
          mkdir -p artifacts
          mv *.ipk artifacts/luci-app-singbox-admin_${{ env.FINAL_VER }}_all.ipk 2>/dev/null || true
          ls -la artifacts/

      - name: Upload to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ github.ref_name }}-${{ env.FINAL_VER }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    # Publish a GitHub Release only for version tags. Branch pushes still build
    # and upload artifacts (above) for validation, but must not create/update a
    # rolling "latest" release -- that was marking a prerelease as latest over
    # the real versioned releases, and failed on every push anyway.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: artifacts
          merge-multiple: true

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          make_latest: true
          generate_release_notes: true
